<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/anamritum_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pure, fresh and wholesome ladoos and protein bars crafted for everyday nourishment." />
    <title>Anamritam Wellness E-Commerce Platform</title>
    <meta property="og:title" content="Anamritam | Pure · Fresh · Wholesome" />
    <meta property="og:description" content="Traditional Indian nourishment, thoughtfully made for today." />
    <meta property="og:image" content="/images/anamritum_logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/images/anamritum_logo.jpg" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('anamritam-theme');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,bn,te,mr,ta,gu,kn,ml,pa,es,fr,de,ar',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
